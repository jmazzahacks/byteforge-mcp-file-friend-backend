# Local disposable validation only. Never use this database for Apollo/Athena deployment.
services:
  database:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: ${FF_DB_NAME:-ff_test}
      POSTGRES_USER: ${FF_DB_USER:-byteforge_file_friend}
      POSTGRES_PASSWORD: ${FF_DB_PASSWORD:?Set a disposable database password}
    volumes:
      - test_database:/var/lib/postgresql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    depends_on:
      database: {condition: service_healthy}
volumes:
  test_database:
