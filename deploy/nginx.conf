server {
    listen 8081;
    server_name _;
    access_log off;  # File IDs and paths are bearer capabilities.
    error_log /dev/stderr crit;
    client_max_body_size 64m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api api:8081;
    set $tusd tusd:8080;
    if ($http_x_http_method_override != "") { return 400; }
    if ($http_x_method_override != "") { return 400; }
    if ($http_x_http_method != "") { return 400; }

    location = /auth {
        internal;
        proxy_pass http://$api/internal/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-FF-Ingress-Auth "";
        proxy_set_header Authorization $http_authorization;
    }
    location /files/ {
        if ($request_method !~ ^(POST|PATCH|HEAD|DELETE|OPTIONS)$) { return 405; }
        auth_request /auth;
        proxy_pass http://$tusd;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-FF-Expiry "";
        proxy_set_header X-API-Key "";
        proxy_set_header X-FF-Ingress-Auth "";
        proxy_set_header Authorization "";
    }
    location ~ "^/api/files/[0-9a-f]{32}$" {
        proxy_pass http://$api;
        proxy_set_header X-FF-Ingress-Auth "";
        proxy_set_header Authorization $http_authorization;
    }
    location ~ "^/f/(?<file_id>[0-9a-f]{32})/(?<file_name>[^/]+)$" {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        alias /data/ff/done/$file_id/$file_name;
        disable_symlinks on;
        autoindex off;
        default_type application/octet-stream;
        add_header Content-Disposition attachment always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
    }
    location = /health { proxy_pass http://$api/health; }
    location = /ready { proxy_pass http://$api/ready; }
    location / { return 404; }
}
